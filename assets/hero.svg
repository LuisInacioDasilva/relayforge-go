<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="t d"><title id="t">RelayForge</title><desc id="d">Banner de entrega de eventos com linhas animadas entre fila e destino.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111b"/><stop offset="1" stop-color="#164331"/></linearGradient><pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b8ed78" stroke-opacity=".1"/></pattern><style>.ey{font:700 12px monospace;letter-spacing:4px;fill:#c5f16d}.title{font:800 72px Arial,sans-serif;letter-spacing:-5px;fill:#f0f8f5}.sub{font:400 18px Arial,sans-serif;fill:#9dc4ae}.flow{stroke-dasharray:10 12;animation:move 4s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-132}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="270" rx="18" fill="url(#bg)"/><rect width="1200" height="270" rx="18" fill="url(#g)"/><text x="68" y="70" class="ey">GO / DURABLE DELIVERY / WEBHOOKS</text><text x="68" y="157" class="title">RELAYFORGE<tspan fill="#c5f16d">.</tspan></text><text x="69" y="210" class="sub">Aceitar. Persistir. Entregar. Rastrear.</text><path class="flow" d="M720 136H820M910 136H1010" stroke="#c5f16d" stroke-width="3"/><rect x="820" y="83" width="90" height="106" rx="8" fill="#153a3b" stroke="#c5f16d"/><text x="840" y="142" fill="#c5f16d" font="700 15px monospace">QUEUE</text><circle class="pulse" cx="1035" cy="136" r="35" fill="#c5f16d" fill-opacity=".15" stroke="#c5f16d"/><path d="m1021 136 10 10 20-24" fill="none" stroke="#c5f16d" stroke-width="5"/></svg>
